project:
  type: book
  output-dir: _book
  resources:
    - "notebooks/**/*.ipynb"   # kopiert Original-Notebooks ins Output
                               # → Voraussetzung für den Download-Link (Abschnitt 4)

execute:
  freeze: true                 # niemals Code beim Build neu ausführen

book:
  title: "Mein Quarto Book"
  author: "Jacques Mock Schindler"
  date: today
  downloads: [pdf]             # PDF-Download-Button in der HTML-Navbar
  chapters:                    # manuell gepflegtes Inhaltsverzeichnis
    - index.qmd
    - part: "Teil I"
      chapters:
        - notebooks/kapitel-01/kapitel-01.ipynb
        - notebooks/kapitel-02/kapitel-02.ipynb

format:
  html:
    theme: cosmo
    toc: true
    code-tools: false
  pdf:
    documentclass: scrbook     # KOMA-Script; scrreprt für einseitiges Layout
    pdf-engine: lualatex
    papersize: a4
    toc: true
    toc-depth: 2
    number-sections: true
    colorlinks: true
    lang: de
    keep-tex: false            # bei Bedarf auf true für Debugging
    include-in-header:
      text: |
        \KOMAoptions{parskip=half}