name: Render and Publish Quarto Book

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true        # TeX-Distribution für den PDF-Build

      # Nur nötig, falls .qmd-Dateien OHNE Freeze-Cache existieren.
      # Bei freeze: true + committetem _freeze/ bzw. reinen .ipynb
      # mit gespeicherten Outputs kann dieser Block entfallen.
      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.12"
      # - name: Install Python dependencies
      #   run: pip install -r requirements.txt jupyter

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}